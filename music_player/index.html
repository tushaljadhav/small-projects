<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="music-player">
        <nav>
            <div class="circle">
                <i class="fa-solid fa-angle-left"></i>
            </div>
            <div class="circle">
                <i class="fa-solid fa-bars"></i>
            </div>
        </nav>

        <img src="instrument/kishore_kumar_resized.png" class="song-img">

        <h1>Pal Pal Dil Ke Paas</h1>
        <p>Kishore Kumar</p>

        <audio id="song">
            <source src="instrument/videoplayback.mp3" type="audio/mpeg">
        </audio>

        <input type="range" value="0" id="progress" >

        <div class="controls">
            <div onclick="backward5()">
                <i class="fa-solid fa-backward"></i>
            </div>

            <div onclick="playPause()">
                <i class="fa-solid fa-play" id="ctrlIcon"></i>
            </div>

            <div onclick="forward5()">
                <i class="fa-solid fa-forward"></i>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
